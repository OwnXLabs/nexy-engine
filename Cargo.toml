[package]
name = "nexy-engine"
version = "0.0.5"
edition = "2024"
description = "A small, sandboxed agent engine for local models"
license = "MIT"
repository = "https://github.com/OwnXLabs/nexy-engine"
readme = "README.md"
keywords = ["agent", "llm", "local", "sandbox", "openai"]
categories = ["command-line-utilities"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio"] }
mimalloc = { version = "0.1.52", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.2.0"
ureq = { version = "2", features = ["json"] }
cap-std = "3"
jiff = { version = "0.2.42", default-features = false, features = ["std", "tzdb-bundle-always"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }
