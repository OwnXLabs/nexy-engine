<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexy Engine</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mute:#78716c;--line:#e7e5e4;--card:#fff;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#f5f5f4;--mute:#a8a29e;--line:#292524;--card:#1c1917;--acc:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100dvh}
header,form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
form{border-top:1px solid var(--line);border-bottom:0}
header b{margin-right:auto}
input,select,button,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
#send{background:var(--acc);color:#fff;border:0}
textarea{flex:1;min-width:200px;resize:none;height:44px}
main{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:760px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.user{align-self:flex-end;background:var(--acc);color:#fff;border:0}
.tool{font:12px/1.4 ui-monospace,monospace;color:var(--mute)}
.tool details summary{cursor:pointer}
.meta{font-size:12px;color:var(--mute)}
label{font-size:13px;color:var(--mute);display:flex;gap:4px;align-items:center}
</style>
</head>
<body>
<header>
<b>Nexy Engine</b>
<select id="bot" title="bot"></select>
<input id="user" placeholder="user" value="owner" size="8" title="x-nexy-user">
<label><input type="checkbox" id="research"> research</label>
<button id="new" type="button">New chat</button>
<button id="key" type="button">Key</button>
</header>
<main id="log"></main>
<form id="f">
<textarea id="q" placeholder="Message" autofocus></textarea>
<button id="send">Send</button>
</form>
<script>
const $ = id => document.getElementById(id);
const store = {get(k){try{return sessionStorage.getItem(k)||""}catch{return ""}}, set(k,v){try{sessionStorage.setItem(k,v)}catch{}}};
let prev = null;
function headers(){
  const h = {"content-type":"application/json","x-nexy-user":$("user").value.trim()||"owner"};
  const k = store.get("key"); if(k) h.authorization = "Bearer " + k;
  return h;
}
function add(cls, text){
  const d = document.createElement("div"); d.className = "m " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9; return d;
}
function tool(item){
  const d = document.createElement("div"); d.className = "tool";
  const det = document.createElement("details"); const s = document.createElement("summary");
  const pre = document.createElement("div");
  if(item.type === "function_call"){ s.textContent = "→ " + item.name + " " + item.arguments; }
  else { s.textContent = "← result (" + (item.output||"").length + " chars)"; pre.textContent = item.output; }
  det.append(s, pre); d.appendChild(det); $("log").appendChild(d); $("log").scrollTop = 1e9;
}
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers: headers()}, opts||{}));
  if(r.status === 401){ ask(); throw new Error("key needed"); }
  return r;
}
function ask(){ const k = prompt("Engine key (kept in this tab only)", store.get("key")); if(k !== null) store.set("key", k.trim()); }
async function bots(){
  try{
    const r = await api("/v1/harnesses"); const d = await r.json();
    $("bot").replaceChildren(...d.harnesses.map(h => new Option(h.name, h.id)));
  }catch(e){}
}
async function send(text){
  add("user", text);
  const body = {input: text, stream: true, metadata: {harness_id: $("bot").value, research: $("research").checked}};
  if(prev) body.previous_response_id = prev;
  const t0 = performance.now();
  const r = await api("/v1/responses", {method: "POST", body: JSON.stringify(body)});
  if(!r.ok){ const e = await r.json().catch(() => ({})); add("meta", "error: " + (e.error && e.error.message || r.status)); return; }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = ""; let out = null;
  for(;;){
    const {value, done} = await reader.read(); if(done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while((i = buf.indexOf("\n\n")) >= 0){
      const line = buf.slice(0, i); buf = buf.slice(i + 2);
      if(!line.startsWith("data: ")) continue;
      const ev = JSON.parse(line.slice(6));
      if(ev.type === "response.output_item.done" && ev.item.type !== "message") tool(ev.item);
      if(ev.type === "response.output_text.delta"){ out = out || add("bot", ""); out.textContent += ev.delta; }
      if(ev.response && ev.type !== "response.created" && ev.type !== "response.in_progress"){
        const res = ev.response; prev = res.id;
        const u = res.usage || {};
        add("meta", res.status + " · " + ((performance.now() - t0) / 1000).toFixed(1) + " s · " + (u.input_tokens||0) + " in / " + (u.output_tokens||0) + " out" + (res.error ? " · " + res.error.message : ""));
      }
    }
  }
}
$("f").onsubmit = e => { e.preventDefault(); const t = $("q").value.trim(); if(!t) return; $("q").value = ""; send(t).catch(err => add("meta", String(err))); };
$("q").onkeydown = e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("f").requestSubmit(); } };
$("new").onclick = () => { prev = null; $("log").replaceChildren(); };
$("key").onclick = () => { ask(); bots(); };
bots();
</script>
</body>
</html>
